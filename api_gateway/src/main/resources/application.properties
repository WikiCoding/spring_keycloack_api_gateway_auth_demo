spring.application.name=api_gateway
server.port=8080

products.service.url=${PRODUCTS_SERVICE_URL:lb://products}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
gateway.rate-limit.replenish-rate=${RATE_LIMIT_REPLENISH_RATE:10}
gateway.rate-limit.burst-capacity=${RATE_LIMIT_BURST_CAPACITY:20}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/products}
keycloak.url=${KEYCLOAK_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:products}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:products-client}
