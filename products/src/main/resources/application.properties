spring.application.name=products
server.port=8081

spring.r2dbc.url=${PRODUCTS_R2DBC_URL:r2dbc:postgresql://localhost:5432/products}
spring.r2dbc.username=${PRODUCTS_DB_USERNAME:products}
spring.r2dbc.password=${PRODUCTS_DB_PASSWORD:products}

spring.flyway.url=${PRODUCTS_JDBC_URL:jdbc:postgresql://localhost:5432/products}
spring.flyway.user=${PRODUCTS_DB_USERNAME:products}
spring.flyway.password=${PRODUCTS_DB_PASSWORD:products}
